<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="description" content="Lecture du document Markdown avec sections repliables.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2315213b'/%3E%3Ctext x='8' y='43' fill='white' font-size='30'%3EMD%3C/text%3E%3C/svg%3E">
<title>Lecteur Markdown — Français</title>
<style>
:root{--ink:#24324a;--muted:#526078;--accent:#4938a6;--line:#d8deea}
*{box-sizing:border-box}
body{margin:0;background:#f3f5f9;color:var(--ink);font:1rem/1.75 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input{font:inherit}
a{color:var(--accent);text-underline-offset:.2em;overflow-wrap:anywhere}
:focus-visible{outline:3px solid #ad5100;outline-offset:4px}
.skip{position:absolute;top:-5rem;left:1rem;z-index:3;background:white;padding:.6rem 1rem}
.skip:focus{top:1rem}
.shell{max-width:1120px;margin:auto;padding:1.5rem}
.floating-toc,.toc-restore{display:none}
@media(min-width:1100px){
  body.has-toc>.document-layout,body.has-toc>header>.shell{max-width:1440px;padding-left:calc(260px + 3rem)}
  .floating-toc,.toc-restore{display:block;position:fixed;left:max(1.5rem,calc((100% - 1440px)/2 + 1.5rem));top:1.5rem;width:260px;z-index:2}
  .floating-toc{background:white;border:1px solid var(--line);border-radius:.8rem;box-shadow:0 5px 24px #24324a0a;max-height:calc(100dvh - 3rem);display:flex;flex-direction:column}
}
.toc-header{display:flex;align-items:center;gap:.25rem;padding:.65rem .75rem;border-bottom:1px solid var(--line);flex-shrink:0}
.toc-header h2{font-size:1rem;margin:0 auto 0 0;line-height:1.4}
.toc-header button{background:transparent;color:var(--muted);border-color:transparent;min-width:36px;min-height:36px;padding:.2rem .45rem;font-size:1.1rem}
.toc-header button:hover{background:#f0edf9;color:var(--accent)}
.toc-links{overflow:auto;overscroll-behavior:contain;padding:.75rem;scrollbar-gutter:stable;min-height:0}
.toc-links ul{list-style:none;margin:0;padding:0}
.toc-links ul ul{margin:.25rem 0 .4rem .45rem;padding-left:.65rem;border-left:1px solid var(--line)}
.toc-links li{margin:.2rem 0}
.toc-links a{display:block;padding:.45rem .25rem;font-size:.85rem;line-height:1.5;color:#384867;text-decoration:none;border-radius:.3rem}
.toc-links a:hover,.toc-links a:focus-visible{background:#f0edf9;color:var(--accent)}
.toc-restore{background:white;color:var(--accent);border-color:var(--line);box-shadow:0 5px 24px #24324a0a}
header{background:#15213b;color:#f4f7ff;border-top:5px solid #bff5d9}
header .shell{padding-top:1.5rem;padding-bottom:1.5rem}
header h1{font-size:clamp(1.8rem,4vw,2.7rem);line-height:1.3;margin:.4rem 0;overflow-wrap:anywhere}
header p{margin:.4rem 0}
.lab-description{font-size:1.05rem;line-height:1.85;margin:1.2rem 0!important;overflow-wrap:anywhere}
.lab-properties{display:flex;gap:.75rem;flex-wrap:wrap;margin:1rem 0 0}
.lab-properties>div{display:flex;gap:.45rem;border:1px solid #78859e;border-radius:2rem;padding:.25rem .85rem}
.lab-properties dt{font-weight:700}
.lab-properties dd{margin:0}
.file-location{font-size:.85rem;overflow-wrap:anywhere;color:#dbe4f4}
.directory-row{display:flex;align-items:center;gap:.4rem}
.directory-row>span{min-width:0}
.copy-code.copy-directory{position:static;flex:0 0 44px}
.file-location .copy-feedback{color:#bff5d9}
.file-location .copy-feedback[data-error="true"]{color:#ffd0bd}
.toolbar{display:flex;gap:.7rem;flex-wrap:wrap;margin:1rem 0}
button{border:1px solid #97a4bf;border-radius:.45rem;padding:.5rem .9rem;min-height:44px}
button{background:#bff5d9;color:#142c23;font-weight:650;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
header :focus-visible{outline-color:#ffcd81}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
#viewer-error{background:#fff1ec;border-left:4px solid #a73710;color:#772509;padding:.8rem 1rem;border-radius:.3rem;margin:1rem 0}
[hidden]{display:none!important}
main{background:white;border:1px solid var(--line);border-radius:.8rem;padding:clamp(1.1rem,4vw,3rem);min-width:0}
.empty{color:var(--muted);margin:0}
main h1,main h2,main h3,main h4{line-height:1.3;scroll-margin-top:1rem;overflow-wrap:anywhere}
main h1{font-size:clamp(1.8rem,4vw,2.7rem);letter-spacing:-.025em;margin-top:0}
main h2{font-size:1.65rem;margin-top:2.5rem}
main h3{font-size:1.25rem;margin-top:2rem}
main h4{font-size:1.05rem;margin-top:1.7rem}
.document-section{margin:1.2rem 0;border-top:1px solid var(--line);padding-top:.5rem}
.document-section>summary{cursor:pointer;padding:.6rem .25rem;min-height:44px;color:var(--accent);border-radius:.35rem}
.document-section>summary:hover{background:#f5f3fc}
.document-section>summary>h2,.document-section>summary>h3,.document-section>summary>h4,.document-section>summary>h5,.document-section>summary>h6{display:inline;margin:0;color:var(--ink)}
.document-section:not([open])>summary{color:var(--muted)}
.section-content{min-width:0}
p{margin:.8rem 0 1rem}
ul,ol{padding-left:1.5rem}
li{margin:.5rem 0;overflow-wrap:anywhere}
hr{border:0;border-top:1px solid var(--line);margin:2rem 0}
img{display:block;max-width:100%;height:auto;margin:1.2rem auto;border:1px solid var(--line);border-radius:.5rem}
code{font: .9em ui-monospace,Consolas,monospace;background:#eef0f6;padding:.1rem .25rem;border-radius:.2rem;overflow-wrap:anywhere}
pre{background:#192740;color:#f4f7ff;padding:1.2rem;border-radius:.5rem;white-space:pre-wrap;overflow-wrap:anywhere}
pre code{background:none;padding:0;color:inherit;white-space:inherit;line-height:1.65}
.copy-block{position:relative;margin:1rem 0}
.copy-block pre{margin:0;padding-right:4.2rem;min-height:4rem}
.copy-code{position:absolute;top:.4rem;right:.4rem;display:grid;place-items:center;width:44px;height:44px;padding:.5rem;background:transparent;border:1px solid transparent;color:#f4f7ff;border-radius:.4rem}
.copy-code:hover{background:#314563;border-color:#a5b5cd}
.copy-code:focus-visible{outline-color:#ffcd81}
.copy-code svg{width:20px;height:20px;pointer-events:none}
.copy-code[data-copied="true"]{color:#bff5d9}
.copy-feedback{margin:.3rem 0 0;font-size:.85rem;color:var(--ink);overflow-wrap:anywhere}
.copy-feedback[data-error="true"]{color:#8a2e14}
@media print{.copy-code,.copy-feedback{display:none!important}.copy-block pre{padding-right:1.2rem}}
blockquote{margin:1.2rem 0;padding:.8rem 1.1rem;border-left:4px solid #6950ad;background:#f3f0fc;border-radius:0 .5rem .5rem 0}
blockquote p:first-child{margin-top:0}
blockquote p:last-child{margin-bottom:0}
.tip{border-color:#26734c;background:#eff9f3}
.warning,.caution{border-color:#a56709;background:#fff6e5}
.table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:.5rem;margin:1.2rem 0}
table{width:100%;border-collapse:collapse;font-size:.9rem;line-height:1.6}
th,td{padding:.8rem;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);min-width:6rem;overflow-wrap:anywhere}
th{background:#eef1f7}
tr:last-child td{border-bottom:0}
tbody tr:nth-child(even){background:#fafbfe}
@media(max-width:600px){.shell{padding:1rem}main h2{font-size:1.35rem}th,td{padding:.6rem}}
@media print{.toolbar,.skip,#viewer-error,.floating-toc,.toc-restore{display:none!important}body.has-toc>.document-layout,body.has-toc>header>.shell{max-width:none;padding:0}header{background:white;color:black;border:0}body{background:white}.shell{padding:0}main{border:0;padding:0}.table-scroll{overflow:visible}pre{background:#eee;color:black}h1,h2,h3,h4,summary{break-after:avoid}img{max-height:18cm;object-fit:contain;break-inside:avoid}}
@media(forced-colors:active){header,main,button,blockquote,pre{border:1px solid CanvasText}header{color:CanvasText}}
</style>
</head>
<body>
<a class="skip" href="#viewer-content">Aller au document</a>
<header>
<div class="shell">
<div id="viewer-title-slot"><h1>Chargement du document…</h1></div>
<p id="viewer-description" class="lab-description" hidden></p>
<dl id="viewer-properties" class="lab-properties" hidden></dl>
<div id="viewer-toolbar" class="toolbar" aria-label="Commandes du lecteur" hidden>
<button id="viewer-open" type="button" aria-describedby="viewer-location">Ouvrir le fichier Lab</button>
<button id="viewer-reload" type="button">Actualiser l’affichage</button>
</div>
<div id="viewer-location" class="file-location" hidden>
<div class="directory-row">
<span id="viewer-directory"></span>
<button id="viewer-copy-directory" class="copy-code copy-directory" type="button" aria-label="Copier le chemin du répertoire courant" title="Copier le chemin du répertoire courant"></button>
</div>
<p id="viewer-location-help"></p>
<p id="viewer-directory-feedback" class="copy-feedback" hidden></p>
</div>
<input id="viewer-file" type="file" accept=".md,.markdown,text/markdown,text/plain" hidden aria-label="Choisir un fichier Markdown">
<p id="viewer-status" class="sr-only" role="status" aria-live="polite"></p>
</div>
</header>
<nav id="viewer-toc" class="floating-toc" aria-labelledby="viewer-toc-title" hidden>
<div class="toc-header">
<h2 id="viewer-toc-title">Dans cet atelier</h2>
<button id="viewer-toc-minimize" type="button" aria-label="Réduire le sommaire" aria-expanded="true" aria-controls="viewer-toc-links" title="Réduire le sommaire">−</button>
<button id="viewer-toc-close" type="button" aria-label="Fermer le sommaire" title="Fermer le sommaire">×</button>
</div>
<div id="viewer-toc-links" class="toc-links"></div>
</nav>
<button id="viewer-toc-restore" class="toc-restore" type="button" aria-controls="viewer-toc" hidden>Afficher le sommaire</button>
<div class="shell document-layout">
<div id="viewer-error" role="alert" hidden></div>
<main id="viewer-content" tabindex="-1" aria-label="Document Markdown">
<p class="empty">Le document s’affichera ici après son chargement.</p>
</main>
<noscript><p>Activez JavaScript pour afficher le Markdown, ou ouvrez le fichier .md directement dans votre éditeur.</p></noscript>
</div>

<script>
(() => {
  'use strict';
  const sourceUrl = new URL(location.href);
  sourceUrl.search = sourceUrl.hash = '';
  sourceUrl.pathname = sourceUrl.pathname.replace(/\.html?$/i, '.md');
  const sourceUrls = [sourceUrl];
  // Preserve the existing .viewer.html entry point without duplicating the Markdown.
  if (/\.viewer\.md$/i.test(sourceUrl.pathname)) {
    const fallback = new URL(sourceUrl);
    fallback.pathname = fallback.pathname.replace(/\.viewer\.md$/i, '.md');
    sourceUrls.push(fallback);
  }
  const content = document.getElementById('viewer-content');
  const titleSlot = document.getElementById('viewer-title-slot');
  const toolbar = document.getElementById('viewer-toolbar');
  const description = document.getElementById('viewer-description');
  const properties = document.getElementById('viewer-properties');
  const fileLocation = document.getElementById('viewer-location');
  const status = document.getElementById('viewer-status');
  const errorBox = document.getElementById('viewer-error');
  const openButton = document.getElementById('viewer-open');
  const reloadButton = document.getElementById('viewer-reload');
  const input = document.getElementById('viewer-file');
  const toc = document.getElementById('viewer-toc');
  const tocLinks = document.getElementById('viewer-toc-links');
  const tocMinimize = document.getElementById('viewer-toc-minimize');
  const tocClose = document.getElementById('viewer-toc-close');
  const tocRestore = document.getElementById('viewer-toc-restore');
  let tocClosed = false;
  let tocReduced = false;
  const isLocal = location.protocol === 'file:';
  const directoryUrl = new URL('.', location.href);
  const directoryPath = isLocal
    ? (directoryUrl.hostname ? '\\\\' + directoryUrl.hostname : '') + decodeURIComponent(directoryUrl.pathname).replace(/^\/(?=[A-Za-z]:)/, '').replaceAll('/', '\\')
    : directoryUrl.href;
  document.getElementById('viewer-directory').textContent = (isLocal ? 'Dossier du HTML : ' : 'Adresse du dossier : ') + directoryPath;
  document.getElementById('viewer-location-help').textContent = isLocal
    ? 'À sélectionner lors de la première ouverture ; le navigateur décide du dossier initial.'
    : 'Le navigateur décide du dossier initial. Après une première sélection, son dossier sera réutilisé si cette fonction est disponible.';
  const copyIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" focusable="false"><rect x="8" y="3" width="11" height="14" rx="2"/><path d="M5 7H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-1"/></svg>';
  const directoryCopy = document.getElementById('viewer-copy-directory');
  directoryCopy.innerHTML = copyIcon;
  bindCopyButton(directoryCopy, document.getElementById('viewer-directory-feedback'), () => directoryPath,
    'Le chemin du répertoire a été copié dans le presse-papiers.',
    'Sélectionnez le chemin et utilisez Ctrl+C (ou Cmd+C).');
  let handle = null;
  let selectionMode = false;
  let busy = false;
  let displayedFilename = '';
  const collapsedByFile = new Map();
  let printClosed = [];
  const parser = window.markdownit({ html: true, linkify: false });
  const escape = parser.utils.escapeHtml;
  const labels = { NOTE: 'Remarque', TIP: 'Conseil', IMPORTANT: 'Important', WARNING: 'Attention', CAUTION: 'Prudence' };
  parser.renderer.rules.html_block = tokensAsText;
  parser.renderer.rules.html_inline = tokensAsText;
  function tokensAsText(tokens, index) { return escape(tokens[index].content); }
  parser.renderer.rules.link_open = (tokens, index, options, env, self) => {
    if (!tokens[index].attrGet('href').startsWith('#')) {
      tokens[index].attrSet('target', '_blank');
      tokens[index].attrSet('rel', 'noopener noreferrer');
      tokens[index].attrSet('title', 'Ouvrir dans un nouvel onglet');
    }
    return self.renderToken(tokens, index, options);
  };
  parser.renderer.rules.table_open = (tokens, index, options, env) => {
    env.tableIndex = (env.tableIndex || 0) + 1;
    return `<div class="table-scroll" role="region" aria-label="Tableau ${env.tableIndex} à défilement horizontal" tabindex="0"><table>`;
  };
  parser.renderer.rules.table_close = () => '</table></div>';
  parser.renderer.rules.th_open = (tokens, index, options, env, self) => {
    tokens[index].attrSet('scope', 'col');
    return self.renderToken(tokens, index, options);
  };

      tokens[index].attrSet('class', match[1].toLowerCase());

    }

    }

      const token = tokens[index];
      if (token.type === 'inline' && tokens[index - 1]?.type === 'paragraph_open' && tokens[index + 1]?.type === 'paragraph_close' && tokens[index + 2]?.type === 'heading_open') {

      if (token.type === 'heading_open') {
        const label = tokens[index + 1].content;
        const base = pendingAnchor || label.toLowerCase().replace(/<[^>]*>/g, '').replace(/[^\p{L}\p{N}_\s-]/gu, '').replace(/\s/g, '-') || 'section';
        let id = base, suffix = 0;
        while (used.has(id)) id = `${base}-${++suffix}`;
        token.attrSet('id', id);
        used.add(id);
        pendingAnchor = null;
      }
    }
    rememberSections();
    content.innerHTML = parser.renderer.render(tokens, parser.options, {});
    addCopyButtons();
    const heading = content.querySelector('h1');
    const title = heading || document.createElement('h1');
    if (!heading) title.textContent = filename.replace(/\.md$/i, '');
    titleSlot.replaceChildren(title);
    document.title = title.textContent;
    description.textContent = metadata.description == null ? '' : String(metadata.description);
    description.hidden = !description.textContent;
    properties.replaceChildren();
    for (const [key, label] of [['difficulty', 'Niveau'], ['duration', 'Durée']]) {
      const value = metadata[key];
      if (value == null || value === '') continue;
      const item = document.createElement('div');
      const term = document.createElement('dt');
      const definition = document.createElement('dd');
      term.textContent = label;
      definition.textContent = key === 'duration' && /^\d+(?:\.\d+)?$/.test(String(value)) ? `${value} min` : String(value);
      item.append(term, definition);
      properties.append(item);
    }
    properties.hidden = !properties.childElementCount;
    displayedFilename = filename;
    makeSections(collapsedByFile.get(filename) || new Set());
    buildToc();
    toolbar.hidden = !selectionMode;
    fileLocation.hidden = toolbar.hidden;
    errorBox.hidden = true;
    errorBox.textContent = '';
    status.textContent = `${filename} — chargé à ${new Date().toLocaleTimeString('fr-FR')}.`;
    revealHash();
  }
  function rememberSections() {
    if (displayedFilename) {
      collapsedByFile.set(displayedFilename, new Set([...content.querySelectorAll('.document-section:not([open])')].map(section => section.dataset.heading)));
    }
  }
    function addCopyButtons() {
      for (const code of content.querySelectorAll('pre > code')) {
        const pre = code.parentElement;
        const wrapper = document.createElement('div');
        wrapper.className = 'copy-block';
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'copy-code';
        button.title = 'Copier le contenu';
        button.setAttribute('aria-label', 'Copier le contenu du bloc de code');
        button.innerHTML = copyIcon;
        const feedback = document.createElement('p');
        feedback.className = 'copy-feedback';
        feedback.hidden = true;
        pre.replaceWith(wrapper);
        wrapper.append(pre, button, feedback);
        bindCopyButton(button, feedback, () => code.textContent,
          'Le contenu du bloc a été copié dans le presse-papiers.',
          'Sélectionnez le texte du bloc et utilisez Ctrl+C (ou Cmd+C).');
      }
    }
    function bindCopyButton(button, feedback, getText, successMessage, failureHelp) {
        const initialTitle = button.title;
        let resetTimer;
        let copying = false;
        button.addEventListener('click', async () => {
          if (copying) return;
          copying = true;
          clearTimeout(resetTimer);
          button.setAttribute('aria-busy', 'true');
          feedback.hidden = true;
          delete button.dataset.copied;
          try {
            await copyText(getText());
            button.dataset.copied = 'true';
            button.title = 'Copié !';
            feedback.textContent = 'Copié !';
            feedback.dataset.error = 'false';
            status.textContent = successMessage;
            resetTimer = setTimeout(() => {
              feedback.hidden = true;
              delete button.dataset.copied;
              button.title = initialTitle;
            }, 2500);
          } catch (error) {
            button.title = initialTitle;
            feedback.textContent = `Copie impossible : ${error.message} ${failureHelp}`;
            feedback.dataset.error = 'true';
            status.textContent = feedback.textContent;
          } finally {
            feedback.hidden = false;
            copying = false;
            button.removeAttribute('aria-busy');
          }
        });
    }
    async function copyText(text) {
      if (navigator.clipboard?.writeText) {
        await navigator.clipboard.writeText(text);
        return;
      }
      // Older browsers and some file:// contexts do not expose the Clipboard API.
      const field = document.createElement('textarea');
      field.value = text;
      field.setAttribute('aria-label', 'Texte à copier');
      field.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px';
      const focused = document.activeElement;
      document.body.append(field);
      try {
        field.select();
        if (!document.execCommand('copy')) throw new Error('le navigateur a refusé l’accès au presse-papiers.');
      } finally {
        field.remove();
        focused?.focus({ preventScroll: true });
      }
    }
  function buildToc() {
    const list = document.createElement('ul');
    const headings = content.querySelectorAll('.document-section > summary > h2');
    for (const heading of headings) {
      const item = document.createElement('li');
      const link = document.createElement('a');
      link.href = '#' + encodeURIComponent(heading.id);
      link.textContent = heading.textContent;
      item.append(link);
      list.append(item);
    }
    tocLinks.replaceChildren(list);
    document.body.classList.toggle('has-toc', headings.length > 0);
    toc.hidden = !headings.length || tocClosed;
    tocRestore.hidden = !headings.length || !tocClosed;
  }
  tocMinimize.addEventListener('click', () => {
    tocReduced = !tocReduced;
    tocLinks.hidden = tocReduced;
    tocMinimize.textContent = tocReduced ? '+' : '−';
    tocMinimize.setAttribute('aria-expanded', String(!tocReduced));
    const label = tocReduced ? 'Développer le sommaire' : 'Réduire le sommaire';
    tocMinimize.setAttribute('aria-label', label);
    tocMinimize.title = label;
  });
  tocClose.addEventListener('click', () => {
    tocClosed = true;
    toc.hidden = true;
    tocRestore.hidden = false;
    tocRestore.focus({ preventScroll: true });
  });
  tocRestore.addEventListener('click', () => {
    tocClosed = false;
    toc.hidden = false;
    tocRestore.hidden = true;
    tocMinimize.focus({ preventScroll: true });
  });
  function makeSections(collapsed) {
    const nodes = [...content.childNodes];
    const fragment = document.createDocumentFragment();
    const stack = [{ level: 0, container: fragment }];
    for (const node of nodes) {
      if (node.nodeType === Node.ELEMENT_NODE && /^H[2-6]$/.test(node.tagName)) {
        const level = Number(node.tagName[1]);
        while (stack.at(-1).level >= level) stack.pop();
        const section = document.createElement('details');
        section.className = 'document-section';
        section.dataset.heading = node.id;
        section.open = !collapsed.has(node.id);
        const summary = document.createElement('summary');
        const body = document.createElement('div');
        body.className = 'section-content';
        summary.append(node);
        section.append(summary, body);
        stack.at(-1).container.append(section);
        stack.push({ level, container: body });
      } else {
        stack.at(-1).container.append(node);
      }
    }
    content.replaceChildren(fragment);
  }
  function revealHash() {
    if (!location.hash) return;
    let id;
    try { id = decodeURIComponent(location.hash.slice(1)); }
    catch {
      errorBox.textContent = 'L’ancre de navigation dans l’URL est mal encodée.';
      errorBox.hidden = false;
      return;
    }
    const target = document.getElementById(id);
    if (!target) return;
    for (let parent = target.parentElement; parent; parent = parent.parentElement) {
      if (parent instanceof HTMLDetailsElement) parent.open = true;
    }
    requestAnimationFrame(() => target.scrollIntoView());
  }
  async function run(action) {
    if (busy) return;
    busy = true;
    openButton.disabled = reloadButton.disabled = true;
    try { await action(); }
    catch (error) {
      if (error.name === 'AbortError') {
        status.textContent = 'Sélection annulée. Le document affiché reste inchangé.';
      } else {
        errorBox.textContent = `Chargement impossible : ${error.message} Le dernier affichage éventuel est conservé.`;
        errorBox.hidden = false;
        status.textContent = 'Le document n’a pas été actualisé.';
        toolbar.hidden = false;
        fileLocation.hidden = false;
        if (!displayedFilename) titleSlot.querySelector('h1').textContent = 'Ouvrir le document Markdown';
      }
    } finally {
      busy = false;
      openButton.disabled = reloadButton.disabled = false;
    }
  }
  async function loadUrl() {
    status.textContent = 'Lecture du Markdown…';
    for (let index = 0; index < sourceUrls.length; index++) {
      const url = sourceUrls[index];
      let response;
      try { response = await fetch(url, { cache: 'no-store' }); }
      catch (error) {
        if (isLocal) throw new Error('Le navigateur bloque la lecture automatique en ouverture par double-clic. Sélectionnez le Markdown avec « Ouvrir le fichier Lab », ou ouvrez cette page via un serveur local pour le charger automatiquement.');
        throw error;
      }
      if (response.status === 404 && index < sourceUrls.length - 1) continue;
      const filename = decodeURIComponent(url.pathname.split('/').pop());
      if (!response.ok) throw new Error(`HTTP ${response.status} : ${filename}. Placez le Markdown de même nom à côté du HTML, ou utilisez « Ouvrir le fichier Lab ».`);
      selectionMode = false;
      render(await response.text(), filename);
      return;
    }
  }
  async function chooseFile() {
    if (typeof window.showOpenFilePicker === 'function') {
      const [chosen] = await window.showOpenFilePicker({
        ...(handle ? { startIn: handle } : {}),
        multiple: false,
        types: [{ description: 'Document Markdown', accept: { 'text/markdown': ['.md', '.markdown'] } }]
      });
      const file = await chosen.getFile();
      selectionMode = true;
      render(await file.text(), file.name);
      handle = chosen;
    } else {
      input.value = '';
      input.click();
    }
  }
  openButton.addEventListener('click', () => run(chooseFile));
  input.addEventListener('change', () => {
    const file = input.files[0];
    if (!file) return;
    run(async () => {
      selectionMode = true;
      render(await file.text(), file.name);
      handle = null;
      status.textContent += ' Après modification, « Actualiser » vous demandera de sélectionner à nouveau le fichier.';
    });
  });
  reloadButton.addEventListener('click', () => run(async () => {
    if (handle) {
      const file = await handle.getFile();
      render(await file.text(), file.name);
    } else if (selectionMode || isLocal) {
      await chooseFile();
    } else {
      await loadUrl();
    }
  }));
  content.addEventListener('error', event => {
    if (event.target instanceof HTMLImageElement) {
      errorBox.textContent = 'Une image du Markdown est introuvable. Vérifiez son chemin et conservez le dossier Images à côté du lecteur et du Markdown.';
      errorBox.hidden = false;
    }
  }, true);
  window.addEventListener('hashchange', revealHash);
  document.addEventListener('click', event => {
    const link = event.target.closest('a[href^="#"]');
    if (link && link.hash === location.hash) revealHash();
  });
  window.addEventListener('beforeprint', () => {
    printClosed = [...content.querySelectorAll('.document-section:not([open])')];
    for (const section of printClosed) section.open = true;
  });
  window.addEventListener('afterprint', () => {
    for (const section of printClosed) section.open = false;
    printClosed = [];
  });
  run(loadUrl);
})();
</script>
</body>
</html>
